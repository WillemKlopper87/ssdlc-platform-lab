# 20-gitea — bring up Gitea, wait for real readiness, create the platform
# admin account, and mint an admin API token for 30-oauth.yml to use.
#
# Health-check shape and the admin-bootstrap commands are both grounded in
# commands already run live in this project this session (docs/adr/0009's
# forgery-test work used the identical `gitea admin user create` /
# `gitea admin user list` CLI calls against this same Gitea image), not
# guessed.

- name: Bring up Gitea and bootstrap the platform admin account
  hosts: ssdlc_platform
  gather_facts: false
  vars:
    compose_dir: "{{ playbook_dir }}/../../compose/minimal"
    gitea_container: ssdlc-minimal-gitea
    gitea_url: "http://127.0.0.1:3500"
    gitea_admin_user: gateadmin
    admin_token_file: "{{ compose_dir }}/.gitea_admin_token"

  tasks:
    - name: docker compose up -d gitea
      ansible.builtin.command: docker compose up -d gitea
      args:
        chdir: "{{ compose_dir }}"
      changed_when: true

    - name: Wait for Gitea's /api/healthz to report pass
      # Confirmed live, both in docs/adr/0004 and again in docs/adr/0009:
      # {"status": "pass", ...} once the DB/cache checks underneath it are
      # actually ready -- checked well ahead of assuming any fixed sleep
      # duration is long enough.
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/healthz"
        status_code: 200
        return_content: true
      register: gitea_health
      until: gitea_health.status == 200 and (gitea_health.json.status | default('')) == 'pass'
      retries: 30
      delay: 2

    - name: Read GITEA_ADMIN_PASSWORD generated by 00-base.yml
      ansible.builtin.shell: >
        set -o pipefail; grep '^GITEA_ADMIN_PASSWORD=' {{ compose_dir }}/.env | cut -d= -f2-
      args:
        executable: /bin/bash
      register: gitea_admin_password_raw
      changed_when: false
      no_log: true

    - name: Set fact
      ansible.builtin.set_fact:
        gitea_admin_password: "{{ gitea_admin_password_raw.stdout }}"
      no_log: true

    - name: List existing Gitea users (idempotency check)
      ansible.builtin.command: >
        docker exec -u git {{ gitea_container }} gitea admin user list
      register: gitea_user_list
      changed_when: false

    - name: Create the platform admin account
      when: gitea_admin_user not in gitea_user_list.stdout
      ansible.builtin.command: >
        docker exec -u git {{ gitea_container }}
        gitea admin user create
        --username {{ gitea_admin_user }}
        --password {{ gitea_admin_password }}
        --email {{ gitea_admin_user }}@ssdlc.local
        --admin
        --must-change-password=false
      no_log: true
      changed_when: true

    - name: Check whether an admin API token already exists
      ansible.builtin.stat:
        path: "{{ admin_token_file }}"
      register: admin_token_stat

    - name: Mint an admin API token, only if one hasn't been minted before
      # POST /users/{user}/tokens with basic auth, exactly as used live
      # against the forgery-test harness in docs/adr/0009. write:admin +
      # write:repository + write:user -- broad, because this is the
      # platform's own bootstrap identity (same tradeoff onboard-repo.sh's
      # header comment already states explicitly for GITEA_ADMIN_TOKEN).
      when: not admin_token_stat.stat.exists
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/users/{{ gitea_admin_user }}/tokens"
        method: POST
        url_username: "{{ gitea_admin_user }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          # Static name is fine -- this task only ever runs once, guarded
          # by admin_token_stat.stat.exists above, so no uniqueness need.
          name: "ansible-bootstrap-token"
          scopes: ["write:admin", "write:repository", "write:user"]
        status_code: 201
      register: admin_token_response
      no_log: true

    - name: Persist the admin token for 30-oauth.yml
      when: not admin_token_stat.stat.exists
      ansible.builtin.copy:
        dest: "{{ admin_token_file }}"
        mode: "0600"
        content: "{{ admin_token_response.json.sha1 }}"
      no_log: true
